<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulario Registro</title>
</head>
<body>
	<h1>Crear una cuenta en Discord</h1>
	<form>
		<div>
			<label for="nombre">Nombre:</label>
			<input type="text" id="nombre" name="nombre" required>
		</div>
		<br>
		<div>
			<label for="apellido">Apellido:</label>
			<input type="text" id="apellido" name="apellido" required>
		</div>
		<br>
		<div>
			<label for="correo">Correo electrónico:</label>
			<input type="email" id="correo" name="correo" required>
		</div>
		<br>
		<div>
			<label for="contrasena">Contraseña:</label>
			<input type="password" id="contrasena" name="contrasena" required>
		</div>
		<br>
		<div>
			<label for="confirmar_contrasena">Confirmar contraseña:</label>
			<input type="password" id="confirmar_contrasena" name="confirmar_contrasena" required>
		</div>
		<br>
		<div>
			<label for="fecha_nacimiento">Fecha de nacimiento:</label>
			<input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
		</div>
		<br>
		<div>
			<label>Género:</label>
			<input type="radio" id="masculino" name="genero" value="masculino" required>
			<label for="masculino">Masculino</label>
			<input type="radio" id="femenino" name="genero" value="femenino" required>
			<label for="femenino">Femenino</label>
			<input type="radio" id="otro" name="genero" value="otro" required>
			<label for="otro">Prefiero no decirlo</label>
		</div>
		<br>
		<div>
			<label for="descripcion">Descripción sobre ti:</label><br>
			<textarea id="descripcion" name="descripcion" rows="4" cols="20"></textarea>
		</div>
		<br>
		<div>
			<label for="intereses">Selecciona tus intereses:</label><br>
			<select id="intereses" name="intereses" multiple required>
				<option value="Videojuegos">Videojuegos</option>
				<option value="Música">Música</option>
				<option value="Deportes">Deportes</option>
				<option value="Cine y TV">Cine y TV</option>
				<option value="Tecnología">Tecnología</option>
			</select>
		</div>
		<br>
		<div>
			<input type="checkbox" id="terminos" name="terminos" required>
			<label for="terminos">Al registrarse, acepta los <a href="terminos.html">Términos y condiciones</a> de Discord</label>
		</div>
		<br>
		<button type="submit">Registrarse</button>
	</form>
</body>
</html>
