<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editar perfil</title>

	<link rel="stylesheet" href="../css/style_pag_perfil.css">

	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

	<header class="encabezado">

		<h1>Perfil</h1>

		<nav>
			<a href="../index.html">Inicio</a>
			<a href="perfil.html" class="activo">Mi perfil</a>
			<a href="conexiones.html">Conexiones</a>
			<a class="btn-sesion" href="../index.html">Cerrar sesión</a>
		</nav>

	</header>

	<main class="contenedor-edicion">

		<section class="editar-perfil">

			<h2>
				<i class="bi bi-pencil-square"></i>
				Editar perfil
			</h2>

			<form>

				<div class="campo">

					<label for="nombre">
						Nombre
					</label>

					<input type="text"
						id="nombre"
						name="nombre"
						value="Jaime Adasme">

				</div>

				<div class="campo">

					<label for="ubicacion">
						Ubicación
					</label>

					<input type="text"
						id="ubicacion"
						name="ubicacion"
						value="Lima, Perú">

				</div>

				<div class="campo">

					<label for="cargo">
						Cargo
					</label>

					<input type="text"
						id="cargo"
						name="cargo"
						value="Desarrollador Web">

				</div>

				<div class="campo">

					<label for="descripcion">
						Descripción
					</label>

					<textarea
						id="descripcion"
						name="descripcion">Apasionado por el desarrollo web, la tecnología y la creación de nuevas soluciones.</textarea>

				</div>

				<div class="campo">

					<label for="foto">
						Foto de perfil
					</label>

					<input type="file"
						id="foto"
						name="foto">

				</div>

				<div class="acciones">

					<a href="perfil.html"
						class="btn-cancelar">

						<i class="bi bi-x-circle"></i>
						Cancelar

					</a>

					<button type="button"
						class="btn-guardar">

						<i class="bi bi-check-circle"></i>
						Guardar cambios

					</button>

				</div>

			</form>

		</section>

	</main>

</body>

</html>
